      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }

      .blob { position: absolute; left: 0; top: 0; width: 1100px; height: 1100px; border-radius: 50%; }
      .blob.b1 { background: radial-gradient(circle closest-side, rgba(42, 154, 194, 0.16), rgba(42, 154, 194, 0) 100%); }
      .blob.b2 { background: radial-gradient(circle closest-side, rgba(22, 164, 143, 0.13), rgba(22, 164, 143, 0) 100%); }

      #dots { inset: auto; left: 0; top: 0; width: 1080px; height: 1960px; background-image: radial-gradient(rgba(22, 35, 63, 0.075) 1.5px, transparent 1.8px); background-size: 28px 28px; background-position: 0 0; -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 45%, #000 40%, transparent 100%); mask-image: radial-gradient(ellipse 80% 70% at 50% 45%, #000 40%, transparent 100%); }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .cam { position: absolute; inset: 0; transform-origin: 540px 960px; }
      #s1 { z-index: 11; } #s23 { z-index: 12; } #s45 { z-index: 13; } #s67 { z-index: 14; } #s8 { z-index: 15; }
      #grain { z-index: 40; mix-blend-mode: soft-light; opacity: 0.05; }
      #grain svg { display: block; }

      /* ---- type ---- */
      .pp-h { font-family: var(--display); font-weight: 800; letter-spacing: -0.035em; line-height: 1.04; color: var(--ink); text-align: center; white-space: nowrap; }
      .pp-h.h1 { font-size: 100px; }
      .pp-h.h2 { font-size: 76px; }
      .pp-h.h3 { font-size: 58px; font-weight: 700; }
      .pp-ln { display: block; overflow: hidden; padding: 0.08em 0.2em 0.2em; margin: -0.08em -0.2em -0.2em; }
      .pp-w { display: inline-block; }
      .grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: 0.02em; }
      .mono { font-family: var(--mono); font-weight: 500; text-transform: uppercase; letter-spacing: 0.14em; font-variant-numeric: tabular-nums; }
      .soft { color: var(--ink-soft); }
      .pp-c { display: inline; }

      /* ---- components ---- */
      .pp-phone { position: absolute; background: linear-gradient(145deg, #2b3446 0%, #0d1320 55%, #1c2433 100%); box-shadow: 0 70px 140px rgba(18, 42, 84, 0.3), 0 20px 50px rgba(18, 42, 84, 0.18), inset 0 0 0 2px rgba(255, 255, 255, 0.08); }
      .pp-screen { position: absolute; overflow: hidden; background: #ffffff; }
      .pp-view { position: absolute; left: 0; right: 0; bottom: 0; overflow: hidden; background: #ffffff; }
      .pp-page { position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; }
      .pp-page img { position: absolute; left: 0; top: 0; display: block; }
      .pp-status { position: absolute; left: 0; right: 0; top: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; padding: 0 7% 0 10%; background: #ffffff; font-family: var(--body); font-weight: 600; color: var(--ink); }
      .pp-icons { display: flex; align-items: center; }
      .pp-island { position: absolute; left: 50%; z-index: 4; background: #05070a; border-radius: 999px; }
      .pp-glare { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(118deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0) 32%); }
      .pp-touch { position: absolute; left: 0; top: 0; width: 76px; height: 76px; margin: -38px 0 0 -38px; z-index: 30; }
      .pp-touch-dot { position: absolute; inset: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.88); box-shadow: 0 8px 22px rgba(18, 42, 84, 0.28), inset 0 0 0 2px rgba(18, 42, 84, 0.1); }
      .pp-touch-ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid var(--blue); opacity: 0; }
      .pp-lens { position: absolute; overflow: hidden; border-radius: 26px; background: #ffffff; box-shadow: 0 34px 80px rgba(18, 42, 84, 0.22), 0 0 0 1px var(--line); }
      .pp-lens img { position: absolute; display: block; }
      .pp-pill { position: absolute; display: inline-flex; align-items: center; gap: 14px; padding: 18px 30px; border-radius: 999px; background: #ffffff; border: 1px solid var(--line); box-shadow: var(--shadow-md); font-family: var(--body); font-weight: 600; font-size: 30px; color: var(--ink); white-space: nowrap; }
      .pp-pill.dark { background: var(--navy); color: #ffffff; border-color: transparent; }
      .pp-vial { position: absolute; }
      .pp-vial img { display: block; width: 100%; height: 100%; filter: drop-shadow(0 34px 38px rgba(18, 42, 84, 0.22)); }
      .pp-logo, .pp-symbol { display: block; }

    <script>
      gsap.registerPlugin(DrawSVGPlugin, CustomEase);
      const fonts = ['800 100px "DM Sans"', '700 100px "DM Sans"', '400 40px "Inter"', '500 40px "Inter"', '600 40px "Inter"', '700 40px "Inter"', '400 30px "IBM Plex Mono"', '500 30px "IBM Plex Mono"'].map((f) => document.fonts.load(f));
