<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"LOGO_URL","type":"string","label":"Logo URL (white, transparent SVG/PNG; empty = wordmark)","default":""},
    {"id":"VIAL_URLS","type":"string","label":"Vial render URLs, comma-separated in catalog order (empty = SVG vial)","default":""},
    {"id":"COA_PRODUCT","type":"string","label":"COA hero product","default":"BPC-157"},
    {"id":"AMOUNT","type":"string","label":"Amount","default":"10 mg"},
    {"id":"BATCH","type":"string","label":"Batch code","default":"PP-2611-A"},
    {"id":"PURITY","type":"string","label":"HPLC purity % (one decimal)","default":"99.3"},
    {"id":"LAB","type":"string","label":"Independent lab name","default":"INDEPENDENT LAB"},
    {"id":"TEST_DATE","type":"string","label":"Test date MM/DD/YYYY","default":"09/15/2026"},
    {"id":"M_EXP","type":"string","label":"Expected mass (Da)","default":"1419.5"},
    {"id":"M_OBS","type":"string","label":"Observed mass (Da)","default":"1419.6"},
    {"id":"COA_URL","type":"string","label":"COA page URL (QR code)","default":"https://purepeptide.care/coa/PP-2611-A"},
    {"id":"COUNTRIES","type":"string","label":"Countries shipped to","default":"30"},
    {"id":"END_CTA","type":"string","label":"End card CTA","default":"LAUNCHING DECEMBER 2026 · JOIN THE LIST"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>PurePeptide — Purity you can verify (30 s)</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/vendor/DrawSVGPlugin.min.js"></script>
    <script src="assets/vendor/CustomEase.min.js"></script>
    <script src="assets/vendor/qrcode.js"></script>
    <style>
      @font-face {
        font-family: "Inter Tight";
        src: url("assets/fonts/inter-tight-latin-300-normal.woff2") format("woff2");
        font-weight: 300;
        font-display: block;
      }
      @font-face {
        font-family: "Inter Tight";
        src: url("assets/fonts/inter-tight-latin-500-normal.woff2") format("woff2");
        font-weight: 500;
        font-display: block;
      }
      @font-face {
        font-family: "Inter Tight";
        src: url("assets/fonts/inter-tight-latin-600-normal.woff2") format("woff2");
        font-weight: 600;
        font-display: block;
      }
      @font-face {
        font-family: "IBM Plex Mono";
        src: url("assets/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: "IBM Plex Mono";
        src: url("assets/fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2");
        font-weight: 500;
        font-display: block;
      }
      :root {
        --bg: #05070a;
        --panel: rgba(255, 255, 255, 0.035);
        --line: rgba(234, 242, 255, 0.1);
        --text: #eef3f8;
        --muted: #7d8896;
        --accent: #7fe7ff;
        --paper: #f4f6f8;
        --ink: #0b1016;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Inter Tight", sans-serif;
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }
      .layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #bg {
        background: var(--bg);
      }
      #glow {
        inset: auto;
        left: 0;
        top: 0;
        width: 1300px;
        height: 1300px;
        background: radial-gradient(circle closest-side, rgba(127, 231, 255, 0.1), rgba(127, 231, 255, 0.045) 45%, rgba(127, 231, 255, 0) 100%);
      }
      #grid {
        inset: auto;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1980px;
        background-image:
          linear-gradient(to right, rgba(238, 243, 248, 0.1) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(238, 243, 248, 0.1) 1px, transparent 1px);
        background-size: 60px 60px;
        background-position: 0 0;
      }
      .scene {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .cam {
        position: absolute;
        inset: 0;
        transform-origin: 540px 960px;
      }
      #s12 { z-index: 17; }
      #s3 { z-index: 16; }
      #s4 { z-index: 15; }
      #s5 { z-index: 14; }
      #s6 { z-index: 13; }
      #s7 { z-index: 12; }
      #s8 { z-index: 11; }
      #bloom {
        z-index: 30;
        background: radial-gradient(circle at 540px 1000px, rgba(255, 255, 255, 1) 0px, rgba(190, 245, 255, 0.75) 260px, rgba(127, 231, 255, 0.25) 620px, rgba(127, 231, 255, 0) 1100px);
        mix-blend-mode: screen;
        opacity: 0;
      }
      #grain {
        z-index: 40;
        mix-blend-mode: overlay;
        opacity: 0.04;
      }
      #grain svg {
        display: block;
      }
      #vignette {
        z-index: 41;
        background: radial-gradient(ellipse 78% 62% at 50% 50%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.35) 100%);
      }

      /* ---- shared type system (brief §3) ---- */
      .pp-h {
        font-family: "Inter Tight", sans-serif;
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1;
        color: var(--text);
        text-align: center;
        white-space: nowrap;
      }
      .pp-h.h1 { font-size: 110px; }
      .pp-h.h2 { font-size: 72px; }
      .pp-h.h3 { font-size: 64px; }
      .pp-h.tagline { font-size: 52px; font-weight: 500; }
      .pp-ln {
        display: block;
        overflow: hidden;
        padding: 0.1em 0.2em 0.18em;
        margin: -0.1em -0.2em -0.18em;
      }
      .pp-w {
        display: inline-block;
      }
      .acc { color: var(--accent); }
      .muted { color: var(--muted); }
      .mono {
        font-family: "IBM Plex Mono", monospace;
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-variant-numeric: tabular-nums;
        line-height: 1.25;
      }
      .tnum { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
      .pp-c { display: inline; }
      .pp-scan {
        position: absolute;
        background: var(--accent);
        box-shadow: 0 0 24px 3px rgba(127, 231, 255, 0.85), 0 0 8px rgba(127, 231, 255, 0.9);
        border-radius: 2px;
      }
      .pp-scan-h { height: 2px; }
      .pp-scan-v { width: 2px; }
      .pp-vial { position: absolute; }
      .pp-vial svg { display: block; overflow: visible; }
      .pp-vial-img { width: 100%; height: 100%; object-fit: contain; display: block; }
      .pp-reflect { position: absolute; }
      .pp-reflect .pp-vial { position: relative; }
      .pp-wordmark {
        position: relative;
        display: inline-block;
        white-space: nowrap;
        line-height: 1;
        letter-spacing: -0.03em;
        color: var(--text);
        font-family: "Inter Tight", sans-serif;
      }
      .pp-wordmark .wm-a { font-weight: 600; }
      .pp-wordmark .wm-b { font-weight: 300; }
      .pp-wordmark .wm-i { position: relative; display: inline-block; }
      .pp-wordmark .wm-dot {
        position: absolute;
        left: 50%;
        top: 0.075em;
        width: 0.18em;
        height: 0.18em;
        margin-left: -0.09em;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0.12em rgba(127, 231, 255, 0.6);
      }
      .pp-logo-img { display: block; }
    </style>
    <link rel="stylesheet" href="css/s12.css" />
    <link rel="stylesheet" href="css/s3.css" />
    <link rel="stylesheet" href="css/s4.css" />
    <link rel="stylesheet" href="css/s5.css" />
    <link rel="stylesheet" href="css/s6.css" />
    <link rel="stylesheet" href="css/s7.css" />
    <link rel="stylesheet" href="css/s8.css" />
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="30">
      <div id="bg" class="layer"></div>
      <div id="glow" class="layer"></div>
      <div id="grid" class="layer"></div>

      <!-- Scene windows include the overlap each transition needs (see SCENES.md). -->
      <section id="s12" class="clip scene" data-start="0" data-duration="6" data-track-index="1"></section>
      <section id="s3" class="clip scene" data-start="5.6" data-duration="4.4" data-track-index="2"></section>
      <section id="s4" class="clip scene" data-start="9.5" data-duration="2.5" data-track-index="3"></section>
      <section id="s5" class="clip scene" data-start="12" data-duration="4" data-track-index="4"></section>
      <section id="s6" class="clip scene" data-start="15.5" data-duration="6.5" data-track-index="5"></section>
      <section id="s7" class="clip scene" data-start="22" data-duration="4" data-track-index="6"></section>
      <section id="s8" class="clip scene" data-start="26" data-duration="4" data-track-index="7"></section>

      <div id="bloom" class="layer"></div>
      <div id="grain" class="layer">
        <svg width="1080" height="1920" viewBox="0 0 1080 1920">
          <filter id="grain-f" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
            <feTurbulence id="grain-turb" type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="0" stitchTiles="stitch" />
            <feColorMatrix type="saturate" values="0" />
          </filter>
          <rect width="1080" height="1920" filter="url(#grain-f)" />
        </svg>
      </div>
      <div id="vignette" class="layer"></div>

      <audio id="soundtrack" src="assets/audio/soundtrack.wav" data-start="0" data-duration="30" data-track-index="10" data-volume="1"></audio>
    </div>

    <script src="js/config.js"></script>
    <script src="js/lib.js"></script>
    <script src="js/global.js"></script>
    <script src="js/scenes/s12.js"></script>
    <script src="js/scenes/s3.js"></script>
    <script src="js/scenes/s4.js"></script>
    <script src="js/scenes/s5.js"></script>
    <script src="js/scenes/s6.js"></script>
    <script src="js/scenes/s7.js"></script>
    <script src="js/scenes/s8.js"></script>
    <script>
      gsap.registerPlugin(DrawSVGPlugin, CustomEase);
      Promise.all([
        document.fonts.load('600 100px "Inter Tight"'),
        document.fonts.load('500 100px "Inter Tight"'),
        document.fonts.load('300 100px "Inter Tight"'),
        document.fonts.load('400 40px "IBM Plex Mono"'),
        document.fonts.load('500 40px "IBM Plex Mono"'),
      ]).then(() => {
        const tl = window.PP.build();
        window.__timelines["main"] = tl;
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      });
    </script>
  </body>
</html>
