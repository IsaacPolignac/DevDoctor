<!-- S03 · We measure it · f216–f306 · AI plate hero.mp4 (stage video #v-hero, z 10, media 0 → 3.0, 1:1). Light only: no type, no site.
     Three DIRECT children of the section with their own z-index (the section is not a stacking context, .z-front / .z-back are:
     a screen blend inside them would see black):
       .s03-dim (z 11)   the exposure: a black veil the JS drives — the plate arrives at 78 % on the cut frame and fills to 100 % as the
                         carry band crosses (the light reveals), and breathes down 18 % under the measuring pass, so a screen-blended
                         line of light can read on the white label.
       .s03-matte (z 12) the two light passes: the vial column (stage x 640–1280) masked by a soft luma matte of the vial
                         (assets/fx/make_s03_matte.py → s03_matte_a.png = plate frame 7 ≈ f223 for the S02 band carry; s03_matte_b.png =
                         plate frame 46 ≈ f272 for the measuring pass; both faded to 0 over the top / bottom 48 / 90 px so no band
                         ever meets a frame edge with a hard line), mix-blend-mode: screen onto the plate's pixels. -->
<svg class="s03-defs" width="0" height="0" aria-hidden="true" focusable="false">
  <filter id="s03-shimmer" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
    <!-- the glass shimmer: 12 px fractal noise (baseFrequency 1/12, seed 7, deterministic) displacing the line by ±6 px (scale 12) -->
    <feTurbulence type="fractalNoise" baseFrequency="0.083" numOctaves="2" seed="7" stitchTiles="noStitch" result="n" />
    <feDisplacementMap in="SourceGraphic" in2="n" scale="12" xChannelSelector="R" yChannelSelector="G" />
  </filter>
</svg>
<div class="s03-dim"></div>
<!-- 1. the S02 band carry (§0.9): the 105° band (220 px halo + 2 px core, screen blend) is ON the vial's left side on the cut frame
     f216, already at speed, and is clear of the vial's right edge by f234 -->
<div class="s03-matte s03-a"><div class="s03-band s03-bx"><i></i></div></div>
<!-- 2. MEASURE: a level line of light (2 px core, 220 px halo), cap → base f266–f278, its centre on the label on "measure" (f272).
     Two copies driven by one setter: the glass rows (neck / shoulder, base) go through the shimmer filter; the cap, crimp and label rows do not. -->
<div class="s03-matte s03-b">
  <div class="s03-rows s03-glass"><div class="s03-band s03-by"><i></i></div></div>
  <div class="s03-rows s03-label"><div class="s03-band s03-by"><i></i></div></div>
</div>
