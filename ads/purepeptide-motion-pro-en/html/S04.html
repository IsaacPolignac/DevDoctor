<!-- S04 · "Every batch" · f306–f396 · AI plate cap.mp4 (stage video #v-cap, z 10, media 0 → 3.0, 1:1). Light only: no type, no site.
     The two horizontal passes live in .s04-fx = a DIRECT child of the section with its own z-index 12 (above the plate at 10, below
     the phone layers at 30) so its mix-blend-mode: screen reaches the plate's pixels (.z-front / .z-back are stacking contexts =
     isolated groups, a screen blend inside them would see black). .s04-fx carries the SAME transform as the plate (one setter drives
     #v-cap and .s04-fx: landing scale, 1 %/s push, whip) so the mattes stay registered on the cap; each pass is a full-frame container
     masked by a soft luma matte of the cap (assets/fx/make_s04_matte.py → s04_matte_a.png = plate frame 25 = f336, s04_matte_b.png =
     plate frame 42 ≈ f357; both faded to 0 over the top 48 / bottom 90 px so no band ever meets a frame edge with a hard line).
     #s04-whip: the directional (vertical box) motion kernel of the whip-tilt out, applied to #v-cap on its last 3 frames only; the
     setter rewrites order / kernelMatrix / divisor per frame from the whip's velocity (a 1 × N box = a 360° shutter streak). -->

  <filter id="s04-whip" x="-5%" y="-15%" width="110%" height="130%" color-interpolation-filters="sRGB">
    <feConvolveMatrix id="s04-whip-k" order="1 3" kernelMatrix="1 1 1" divisor="3" edgeMode="duplicate" />
  </filter>
</svg>
