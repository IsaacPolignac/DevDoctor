[workspace]
resolver = "2"
members = [
  "crates/devdoctor-core",
  "crates/devdoctor-platform-macos",
  "crates/devdoctor-detectors",
  "crates/devdoctor-fixers",
  "crates/devdoctor",
  "crates/devdoctor-cli",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
devdoctor-core = { path = "crates/devdoctor-core" }
devdoctor-platform-macos = { path = "crates/devdoctor-platform-macos" }
devdoctor-detectors = { path = "crates/devdoctor-detectors" }
devdoctor-fixers = { path = "crates/devdoctor-fixers" }
devdoctor = { path = "crates/devdoctor" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde", "clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
regex = "1"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
sysinfo = "0.39"
jwalk = "0.9"
plist = "1"
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
similar = "2"
dirs = "6"
libc = "0.2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
