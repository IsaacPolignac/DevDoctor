name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    name: Engine and CLI (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --exclude devdoctor-desktop --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --exclude devdoctor-desktop
      - name: Build the CLI
        run: cargo build --release -p devdoctor-cli
      - name: Smoke test the CLI
        run: |
          ./target/release/devdoctor --version
          ./target/release/devdoctor detectors
          DEVDOCTOR_HOME="$RUNNER_TEMP/devdoctor" ./target/release/devdoctor scan --json > /dev/null
          DEVDOCTOR_HOME="$RUNNER_TEMP/devdoctor" ./target/release/devdoctor startup --json > /dev/null
          DEVDOCTOR_HOME="$RUNNER_TEMP/devdoctor" ./target/release/devdoctor report --markdown > /dev/null
          ./target/release/devdoctor completions zsh > /dev/null

  engine-windows:
    name: Engine and CLI (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --exclude devdoctor-desktop --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --exclude devdoctor-desktop
      - name: Build the CLI
        run: cargo build --release -p devdoctor-cli
      - name: Smoke test the CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $env:DEVDOCTOR_HOME = "$env:RUNNER_TEMP\devdoctor"
          $dd = ".\target\release\devdoctor.exe"
          & $dd --version
          & $dd detectors
          & $dd scan --json | Out-Null
          & $dd path
          & $dd runtimes
          & $dd processes --json | Out-Null
          & $dd ports --json | Out-Null
          & $dd services --json | Out-Null
          & $dd tools --json | Out-Null
          & $dd packages --json | Out-Null
          & $dd storage --no-projects --json | Out-Null
          & $dd snapshot create
          & $dd report --markdown | Out-Null
          & $dd completions powershell | Out-Null
      - name: Daily snapshot through Task Scheduler
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $env:DEVDOCTOR_HOME = "$env:RUNNER_TEMP\devdoctor"
          $env:Path = "$PWD\target\release;$env:Path"
          devdoctor snapshot schedule --hour 3 --minute 30 --dry-run
          devdoctor snapshot schedule --hour 3 --minute 30 -y
          devdoctor snapshot status
          schtasks /Query /TN "DevDoctor Daily Snapshot" | Out-Null
          devdoctor snapshot unschedule -y
          if (-not (devdoctor snapshot status --json | ConvertFrom-Json).installed) { "unscheduled" } else { throw "task still present" }
      - name: Check the Tauri crate
        run: cargo check -p devdoctor-desktop

  desktop:
    name: Web-technology app (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Typecheck and build the frontend
        working-directory: apps/desktop
        run: npm run build
      - name: Check the Tauri crate
        run: cargo check -p devdoctor-desktop

  native-app:
    name: Native macOS app (macOS 26)
    # Needs the macOS 26 SDK (Xcode 26); the job is advisory until that runner image is standard.
    runs-on: macos-26
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and sign the bundle
        run: scripts/build-macos-app.sh
      - name: Verify the bundle
        run: |
          codesign --verify --deep --strict target/macos/DevDoctor.app
          target/macos/DevDoctor.app/Contents/MacOS/devdoctor-engine --version
